version: "3.9"

services:
  backend:
    build: ./backend
    container_name: asistencia_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/asistencia_legislativa.db:/app/asistencia_legislativa.db
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: asistencia_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3